name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # GitHub's Xcode 27 runner image (public preview, arm64 only).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project "Character AI swift project.xcodeproj" \
            -scheme "Character AI swift project" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO
