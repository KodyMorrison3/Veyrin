name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The project targets macOS 27, so the runner needs an Xcode that ships the
      # macOS 27 SDK. If the default Xcode is too old, select a newer one here, e.g.:
      # - run: sudo xcode-select -s /Applications/Xcode_<version>.app

      - name: Build
        run: |
          xcodebuild build \
            -project "Character AI swift project.xcodeproj" \
            -scheme "Character AI swift project" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO
